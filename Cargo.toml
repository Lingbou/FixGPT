[workspace]
members = [
    "crates/fixgpt-core",
    "crates/modeltrace-core",
    "crates/cpa-plugin",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
repository = "https://github.com/Lingbou/FixGPT"

[workspace.dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
rand = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
